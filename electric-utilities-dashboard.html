<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.S. Electric Generation Fleet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #121214;
            --bg-tertiary: #1a1a1e;
            --bg-hover: #252529;
            --border: #2a2a2f;
            --text-primary: #e8e8ed;
            --text-secondary: #9898a0;
            --text-muted: #68686e;
            --accent-nuclear: #ff3366;
            --accent-coal: #ff8844;
            --accent-gas: #ffcc00;
            --accent-hydro: #00ccff;
            --accent-wind: #00ff88;
            --accent-solar: #ffee00;
            --accent-battery: #cc66ff;
            --accent-oil: #ff6644;
            --accent-other: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: auto 1fr;
            height: 100vh;
            gap: 1px;
            background: var(--border);
        }

        header {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-solar), var(--accent-wind));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: var(--bg-primary);
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 14px;
            margin-left: 8px;
        }

        .header-stats {
            display: flex;
            gap: 32px;
        }

        .header-stat {
            text-align: right;
        }

        .header-stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar {
            background: var(--bg-secondary);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .filter-section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

            .filter-section h3 {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                color: var(--text-muted);
                margin-bottom: 12px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

                .filter-section h3 .count {
                    font-family: 'JetBrains Mono', monospace;
                    background: var(--bg-tertiary);
                    padding: 2px 8px;
                    border-radius: 4px;
                    font-size: 10px;
                }

        .search-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

            .search-input:focus {
                border-color: var(--accent-solar);
            }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .filter-chip {
            padding: 6px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

            .filter-chip:hover {
                background: var(--bg-hover);
            }

            .filter-chip.active {
                background: var(--accent-solar);
                color: var(--bg-primary);
                border-color: var(--accent-solar);
            }

            .filter-chip .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
            }

        .fuel-legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }

            .legend-item:hover {
                background: var(--bg-hover);
            }

            .legend-item.active {
                border-color: var(--text-secondary);
            }

            .legend-item.inactive {
                opacity: 0.4;
            }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-label {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .legend-value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            font-size: 10px;
        }

        .map-container {
            position: relative;
            background: var(--bg-primary);
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
        }

        .leaflet-container {
            background: var(--bg-primary) !important;
            font-family: 'Space Grotesk', sans-serif;
        }

        .leaflet-tile {
            /* No filter - using clean Voyager tiles */
        }

        .leaflet-popup-content-wrapper {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .leaflet-popup-tip {
            background: var(--bg-secondary);
        }

        .leaflet-popup-content {
            margin: 0;
            min-width: 280px;
        }

        .plant-popup {
            padding: 16px;
        }

        .plant-popup-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .plant-popup-symbol {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 10px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            color: var(--accent-solar);
        }

        .plant-popup-title h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .plant-popup-title p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .plant-popup-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .plant-popup-stat {
            background: var(--bg-tertiary);
            padding: 10px;
            border-radius: 6px;
        }

        .plant-popup-stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
        }

        .plant-popup-stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .plant-popup-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .plant-popup-tech-tag {
            font-size: 10px;
            padding: 4px 8px;
            background: var(--bg-hover);
            border-radius: 3px;
            color: var(--text-secondary);
        }

        .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
            background: rgba(255, 204, 0, 0.3) !important;
        }

            .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
                background: rgba(255, 204, 0, 0.8) !important;
                color: var(--bg-primary) !important;
                font-family: 'JetBrains Mono', monospace !important;
                font-weight: 600 !important;
            }

        .custom-marker {
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: transform 0.15s;
        }

            .custom-marker:hover {
                transform: scale(1.2);
                z-index: 9999 !important;
            }

        .clear-filters-btn {
            width: 100%;
            padding: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 8px;
        }

            .clear-filters-btn:hover {
                background: var(--bg-hover);
                color: var(--text-primary);
            }

        .stats-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            min-width: 200px;
            z-index: 1000;
        }

            .stats-panel h4 {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: var(--text-muted);
                margin-bottom: 12px;
            }

        .stats-grid {
            display: grid;
            gap: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-solar);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-muted);
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }

            .sidebar {
                max-height: 300px;
            }

            .header-stats {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <h1>U.S. Electric Generation Fleet<span>Interactive Map</span></h1>
            </div>
            <div class="header-stats">
                <div class="header-stat">
                    <div class="header-stat-value" id="total-capacity">—</div>
                    <div class="header-stat-label">Total MW</div>
                </div>
                <div class="header-stat">
                    <div class="header-stat-value" id="total-plants">—</div>
                    <div class="header-stat-label">Plants</div>
                </div>
                <div class="header-stat">
                    <div class="header-stat-value" id="total-companies">—</div>
                    <div class="header-stat-label">Companies</div>
                </div>
            </div>
        </header>

        <aside class="sidebar">
            <div class="filter-section">
                <h3>Search</h3>
                <input type="text" class="search-input" id="search-input" placeholder="Search plants, utilities...">
            </div>

            <div class="filter-section">
                <h3>Fuel Type <span class="count" id="fuel-count">0 selected</span></h3>
                <div class="fuel-legend" id="fuel-legend"></div>
            </div>

            <div class="filter-section">
                <h3>Companies <span class="count" id="company-count">0 selected</span></h3>
                <div class="filter-chips" id="company-chips"></div>
            </div>

            <div class="filter-section">
                <h3>States <span class="count" id="state-count">0 selected</span></h3>
                <div class="filter-chips" id="state-chips"></div>
                <button class="clear-filters-btn" id="clear-filters">Clear All Filters</button>
            </div>
        </aside>

        <main class="map-container">
            <div class="loading-overlay" id="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading generation fleet data...</div>
            </div>
            <div id="map"></div>
            <div class="stats-panel">
                <h4>Filtered Selection</h4>
                <div class="stats-grid">
                    <div class="stat-row">
                        <span class="stat-label">Plants</span>
                        <span class="stat-value" id="filtered-plants">—</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Capacity</span>
                        <span class="stat-value" id="filtered-capacity">—</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Generators</span>
                        <span class="stat-value" id="filtered-generators">—</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script>
        // Fuel type configuration
        const FUEL_CONFIG = {
            'NUC': { label: 'Nuclear', color: '#ff3366' },
            'SUB': { label: 'Coal (Sub)', color: '#ff8844' },
            'BIT': { label: 'Coal (Bit)', color: '#ff6622' },
            'LIG': { label: 'Lignite', color: '#cc5500' },
            'NG': { label: 'Natural Gas', color: '#ffcc00' },
            'WAT': { label: 'Hydro', color: '#00ccff' },
            'WND': { label: 'Wind', color: '#00ff88' },
            'SUN': { label: 'Solar', color: '#ffee00' },
            'MWH': { label: 'Battery', color: '#cc66ff' },
            'DFO': { label: 'Oil/Diesel', color: '#ff6644' },
            'LFG': { label: 'Landfill Gas', color: '#88aa44' },
            'WDS': { label: 'Wood/Biomass', color: '#996633' },
            'MSW': { label: 'Waste', color: '#666666' },
            'OTHER': { label: 'Other', color: '#888888' }
        };

        // Combine some less common fuels
        const FUEL_MAP = {
            'NUC': 'NUC', 'SUB': 'SUB', 'BIT': 'BIT', 'LIG': 'LIG',
            'NG': 'NG', 'WAT': 'WAT', 'WND': 'WND', 'SUN': 'SUN',
            'MWH': 'MWH', 'DFO': 'DFO', 'LFG': 'LFG', 'WDS': 'WDS',
            'MSW': 'MSW', 'RFO': 'DFO', 'JF': 'DFO', 'KER': 'DFO',
            'PC': 'BIT', 'RC': 'BIT', 'SGC': 'BIT', 'OG': 'NG',
            'BFG': 'NG', 'PG': 'NG'
        };

        // State data
        let plantsData = [];
        let map, markerCluster;
        let activeFilters = {
            search: '',
            fuels: new Set(),
            companies: new Set(),
            states: new Set()
        };

        function updateChart(filteredPlants) {
            if (!fuelChart) return;

            // Count plants by normalized fuel type
            const counts = {};
            filteredPlants.forEach(p => {
                const fuel = p.normalizedFuel;
                counts[fuel] = (counts[fuel] || 0) + 1;
            });

            // Sort by count descending
            const sortedFuels = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

            // Prepare data for Chart.js
            const labels = sortedFuels.map(f => FUEL_CONFIG[f] ? FUEL_CONFIG[f].label : f);
            const data = sortedFuels.map(f => counts[f]);
            const colors = sortedFuels.map(f => FUEL_CONFIG[f] ? FUEL_CONFIG[f].color : '#888888');

            fuelChart.data = {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: colors,
                    hoverOffset: 4
                }]
            };
            fuelChart.update();
        }

        // Initialize
        async function init() {
            await loadData();
            initMap();
            initFilters();
            updateDisplay();
            document.getElementById('loading').style.display = 'none';
        }

        async function loadData() {
            // Data will be embedded below
            plantsData = PLANTS_DATA;
            
            // Normalize fuel types
            plantsData.forEach(p => {
                p.normalizedFuel = FUEL_MAP[p.primaryFuel] || 'OTHER';
            });
        }

        function initMap() {
            map = L.map('map', {
                center: [39.5, -98.35],
                zoom: 4,
                minZoom: 3,
                maxZoom: 18
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            markerCluster = L.markerClusterGroup({
                maxClusterRadius: 50,
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: false,
                zoomToBoundsOnClick: true,
                disableClusteringAtZoom: 10
            });

            map.addLayer(markerCluster);
        }

        function initFilters() {
            // Build fuel legend
            const fuelLegend = document.getElementById('fuel-legend');
            const fuelCounts = {};
            
            plantsData.forEach(p => {
                const fuel = p.normalizedFuel;
                fuelCounts[fuel] = (fuelCounts[fuel] || 0) + 1;
            });

            Object.entries(FUEL_CONFIG).forEach(([key, config]) => {
                if (!fuelCounts[key]) return;
                
                const item = document.createElement('div');
                item.className = 'legend-item active';
                item.dataset.fuel = key;
                item.innerHTML = `
                    <div class="legend-dot" style="background: ${config.color}"></div>
                    <span class="legend-label">${config.label}</span>
                    <span class="legend-value">${fuelCounts[key]}</span>
                `;
                item.addEventListener('click', () => toggleFuelFilter(key, item));
                fuelLegend.appendChild(item);
            });

            // Build company chips
            const companyChips = document.getElementById('company-chips');
            const companies = [...new Set(plantsData.map(p => p.symbol))].sort();
            
            companies.forEach(company => {
                const chip = document.createElement('div');
                chip.className = 'filter-chip';
                chip.dataset.company = company;
                chip.textContent = company;
                chip.addEventListener('click', () => toggleCompanyFilter(company, chip));
                companyChips.appendChild(chip);
            });

            // Build state chips
            const stateChips = document.getElementById('state-chips');
            const states = [...new Set(plantsData.map(p => p.state))].sort();
            
            states.forEach(state => {
                const chip = document.createElement('div');
                chip.className = 'filter-chip';
                chip.dataset.state = state;
                chip.textContent = state;
                chip.addEventListener('click', () => toggleStateFilter(state, chip));
                stateChips.appendChild(chip);
            });

            // Search input
            document.getElementById('search-input').addEventListener('input', (e) => {
                activeFilters.search = e.target.value.toLowerCase();
                updateDisplay();
            });

            // Clear filters
            document.getElementById('clear-filters').addEventListener('click', clearAllFilters);

            // Update header stats
            const totalCapacity = plantsData.reduce((sum, p) => sum + p.nameplateCapacity, 0);
            document.getElementById('total-capacity').textContent = formatNumber(totalCapacity);
            document.getElementById('total-plants').textContent = formatNumber(plantsData.length);
            document.getElementById('total-companies').textContent = companies.length;
        }

        function toggleFuelFilter(fuel, element) {
            if (activeFilters.fuels.has(fuel)) {
                activeFilters.fuels.delete(fuel);
                element.classList.remove('active');
                element.classList.add('inactive');
            } else {
                // If this is the first fuel being selected, deactivate all others
                if (activeFilters.fuels.size === 0) {
                    document.querySelectorAll('.legend-item').forEach(el => {
                        if (el.dataset.fuel !== fuel) {
                            el.classList.remove('active');
                            el.classList.add('inactive');
                        }
                    });
                    activeFilters.fuels.add(fuel);
                    element.classList.add('active');
                    element.classList.remove('inactive');
                } else {
                    activeFilters.fuels.add(fuel);
                    element.classList.add('active');
                    element.classList.remove('inactive');
                }
            }

            // If no fuels selected, show all
            if (activeFilters.fuels.size === 0) {
                document.querySelectorAll('.legend-item').forEach(el => {
                    el.classList.add('active');
                    el.classList.remove('inactive');
                });
            }

            updateFilterCounts();
            updateDisplay();
        }

        function toggleCompanyFilter(company, element) {
            if (activeFilters.companies.has(company)) {
                activeFilters.companies.delete(company);
                element.classList.remove('active');
            } else {
                activeFilters.companies.add(company);
                element.classList.add('active');
            }
            updateFilterCounts();
            updateDisplay();
        }

        function toggleStateFilter(state, element) {
            if (activeFilters.states.has(state)) {
                activeFilters.states.delete(state);
                element.classList.remove('active');
            } else {
                activeFilters.states.add(state);
                element.classList.add('active');
            }
            updateFilterCounts();
            updateDisplay();
        }

        function clearAllFilters() {
            activeFilters.search = '';
            activeFilters.fuels.clear();
            activeFilters.companies.clear();
            activeFilters.states.clear();

            document.getElementById('search-input').value = '';
            document.querySelectorAll('.legend-item').forEach(el => {
                el.classList.add('active');
                el.classList.remove('inactive');
            });
            document.querySelectorAll('.filter-chip').forEach(el => {
                el.classList.remove('active');
            });

            updateFilterCounts();
            updateDisplay();
        }

        function updateFilterCounts() {
            document.getElementById('fuel-count').textContent = 
                activeFilters.fuels.size ? `${activeFilters.fuels.size} selected` : 'all';
            document.getElementById('company-count').textContent = 
                activeFilters.companies.size ? `${activeFilters.companies.size} selected` : 'all';
            document.getElementById('state-count').textContent = 
                activeFilters.states.size ? `${activeFilters.states.size} selected` : 'all';
        }

        function filterPlants() {
            return plantsData.filter(plant => {
                // Search filter
                if (activeFilters.search) {
                    const searchStr = `${plant.plantName} ${plant.utilityName} ${plant.symbol} ${plant.state}`.toLowerCase();
                    if (!searchStr.includes(activeFilters.search)) return false;
                }

                // Fuel filter
                if (activeFilters.fuels.size > 0 && !activeFilters.fuels.has(plant.normalizedFuel)) {
                    return false;
                }

                // Company filter
                if (activeFilters.companies.size > 0 && !activeFilters.companies.has(plant.symbol)) {
                    return false;
                }

                // State filter
                if (activeFilters.states.size > 0 && !activeFilters.states.has(plant.state)) {
                    return false;
                }

                return true;
            });
        }

        function updateDisplay() {
            const filtered = filterPlants();
            
            // Update stats
            const totalCapacity = filtered.reduce((sum, p) => sum + p.nameplateCapacity, 0);
            const totalGenerators = filtered.reduce((sum, p) => sum + p.generatorCount, 0);
            
            document.getElementById('filtered-plants').textContent = formatNumber(filtered.length);
            document.getElementById('filtered-capacity').textContent = formatNumber(totalCapacity) + ' MW';
            document.getElementById('filtered-generators').textContent = formatNumber(totalGenerators);

            // Update map markers
            markerCluster.clearLayers();
            
            filtered.forEach(plant => {
                const fuel = plant.normalizedFuel;
                const config = FUEL_CONFIG[fuel] || FUEL_CONFIG['OTHER'];
                const size = getMarkerSize(plant.nameplateCapacity);

                const marker = L.circleMarker([plant.lat, plant.lng], {
                    radius: size,
                    fillColor: config.color,
                    color: 'rgba(255,255,255,0.3)',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                });

                marker.bindPopup(createPopupContent(plant), {
                    maxWidth: 320,
                    className: 'custom-popup'
                });

                markerCluster.addLayer(marker);
            });
        }
